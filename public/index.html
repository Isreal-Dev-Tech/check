<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Football Race</title>
    <style>
        /* Responsive Fix: 20 lanes fit the screen height */
        :root { --lane-h: 4.4vh; }

        body { background: #000; margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; color: white; }

        /* ================= PODIUM LEADERBOARD (Top 3 Champions) ================= */
        .podium-container {
            height: 12vh; background: #0a0a0a; display: flex; 
            align-items: flex-end; justify-content: center; gap: 15px;
            padding-bottom: 5px; border-bottom: 3px solid #222;
        }
        .podium-spot { 
            width: 90px; display: flex; flex-direction: column; align-items: center; 
            background: linear-gradient(to top, #111, #333); border-radius: 10px 10px 0 0;
            position: relative; transition: all 0.5s ease;
        }
        .spot-1 { height: 9vh; border: 2px solid gold; transform: scale(1.1); z-index: 10; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .spot-2 { height: 7vh; border: 2px solid silver; }
        .spot-3 { height: 6vh; border: 2px solid #cd7f32; }

        .podium-flag { font-size: 28px; margin-top: -25px; filter: drop-shadow(0 0 5px black); }
        .podium-wins { font-size: 14px; color: gold; font-weight: 900; }
        .podium-label { font-size: 10px; text-transform: uppercase; margin-bottom: 2px; color: #aaa; }

        /* ================= PITCH CONTAINER ========================== */
        .race-container { width: 100%; height: 88vh; position: relative; }
        
        .lane {
            position: absolute; width: 100%; height: var(--lane-h);
            transition: top 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center;
        }

        /* Pitch Green Colors */
        .lane:nth-child(odd) { background: #1b4d1b; } 
        .lane:nth-child(even) { background: #2d702d; } 

        /* Moving White Lines */
        .lane::after {
            content: ""; position: absolute; bottom: 0; left: 0; width: 200%; height: 2px;
            background-image: linear-gradient(to right, white 50%, transparent 50%);
            background-size: 60px 100%; animation: lineMove 1s linear infinite; opacity: 0.3;
        }
        @keyframes lineMove { 0% { transform: translateX(0); } 100% { transform: translateX(-30px); } }

        /* Ticker - Country Names (Subtle) */
        .news-ticker {
            position: absolute; width: 100%; font-size: 2.5vh; font-weight: 900; 
            color: rgba(255,255,255,0.08); text-transform: uppercase; pointer-events: none;
            left: 20%;
        }

        /* INDIVIDUAL NET PER LANE */
        .lane-net {
            position: absolute; right: 0; top: 0; bottom: 0; width: 60px;
            background: url('/assets/net.png') no-repeat center right;
            background-size: contain; z-index: 10; opacity: 0.9;
        }

        /* START ICON */
        .gift-hint { position: absolute; left: 10px; font-size: 2vh; z-index: 5; filter: drop-shadow(0 0 5px black); }

        /* THE RUNNER (Man running with ball) */
        .runner {
            position: absolute; height: 100%; display: flex; align-items: center;
            transition: left 0.6s cubic-bezier(0.15, 0.88, 0.3, 1); z-index: 5;
        }
        .runner-img { height: 110%; transform: scaleX(-1); filter: drop-shadow(2px 2px 5px rgba(0,0,0,0.7)); }
        .runner-flag { font-size: 2.5vh; margin-right: 5px; }

    </style>
</head>
<body>

    <div class="podium-container">
        <div class="podium-spot spot-2">
            <span class="podium-flag" id="f2">🏳️</span>
            <span class="podium-wins" id="w2">0 WINS</span>
            <span class="podium-label">🥈 2nd</span>
        </div>
        <div class="podium-spot spot-1">
            <span class="podium-flag" id="f1">🏳️</span>
            <span class="podium-wins" id="w1">0 WINS</span>
            <span class="podium-label">🏆 1st</span>
        </div>
        <div class="podium-spot spot-3">
            <span class="podium-flag" id="f3">🏳️</span>
            <span class="podium-wins" id="w3">0 WINS</span>
            <span class="podium-label">🥉 3rd</span>
        </div>
    </div>
    
    <div id="raceTrack" class="race-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];
            const topRank = data.topRank || [];

            // ✅ FIXED LOGIC: Using,, to target specific ranks
            
            // 1st Place Logic
            if (topRank && topRank) {
                document.getElementById('f1').innerText = topRank.flag;
                document.getElementById('w1').innerText = topRank.wins + " WINS";
            } else {
                document.getElementById('f1').innerText = "🏁";
                document.getElementById('w1').innerText = "0 WINS";
            }

            // 2nd Place Logic
            if (topRank && topRank) {
                document.getElementById('f2').innerText = topRank.flag;
                document.getElementById('w2').innerText = topRank.wins + " WINS";
            } else {
                document.getElementById('f2').innerText = "🏁";
                document.getElementById('w2').innerText = "0 WINS";
            }

            // 3rd Place Logic
            if (topRank && topRank) {
                document.getElementById('f3').innerText = topRank.flag;
                document.getElementById('w3').innerText = topRank.wins + " WINS";
            } else {
                document.getElementById('f3').innerText = "🏁";
                document.getElementById('w3').innerText = "0 WINS";
            }

            // ✅ RACE TRACKS
            countries.forEach((c, index) => {
                let lane = document.getElementById(`lane-${c.id}`);
                
                if (!lane) {
                    lane = document.createElement('div');
                    lane.className = 'lane';
                    lane.id = `lane-${c.id}`;
                    track.appendChild(lane);
                }

                lane.style.top = `${index * 4.4}vh`;

                lane.innerHTML = `
                    <div class="news-ticker">${c.name}</div>
                    <div class="gift-hint">${c.giftIcon || '🎁'}</div>
                    <div class="lane-net"></div>
                    <div class="runner" style="left: calc(${c.currentPos}% + 50px)">
                        <div class="runner-flag">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img">
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
