<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Football Race</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }

        /* ================= LEADERBOARD HEADER ================= */
        .header-stats {
            height: 50px; background: #111; display: flex; 
            align-items: center; justify-content: center;
            border-bottom: 2px solid #333; font-weight: bold; color: gold;
            font-size: 20px; z-index: 100; position: relative;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* ================= PITCH CONTAINER ========================== */
        .race-container { 
            width: 100%; 
            height: calc(100vh - 50px); 
            overflow: hidden; 
            position: relative; 
        }
        
        .lane {
            position: absolute; 
            width: 100%; 
            height: 60px; 
            overflow: hidden;
            transition: top 0.5s ease-in-out; 
            left: 0; 
            display: flex; 
            align-items: center;
        }

        /* Alternating Football Pitch Green */
        .lane:nth-child(odd) { background: #1b4d1b; } 
        .lane:nth-child(even) { background: #2d702d; } 

        /* Moving White Lines (Speed effect) */
        .lane::after {
            content: ""; position: absolute; bottom: 0; left: 0; width: 200%; height: 3px;
            background-image: linear-gradient(to right, white 50%, transparent 50%);
            background-size: 80px 100%;
            animation: lineMove 1s linear infinite;
            opacity: 0.4;
        }

        @keyframes lineMove { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-40px); } 
        }

        /* Ticker - Country Names in Background */
        .news-ticker {
            position: absolute; width: 200%; white-space: nowrap;
            font-size: 35px; font-weight: 900; color: #39FF14; 
            text-transform: uppercase; animation: tickerMove 12s linear infinite;
            z-index: 1; opacity: 0.15; pointer-events: none;
        }
        @keyframes tickerMove { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* THE PLAYER (RUNNER) */
        .runner {
            position: absolute; 
            top: 5px; 
            display: flex; 
            align-items: center;
            transition: left 0.6s cubic-bezier(0.15, 0.88, 0.3, 1); 
            z-index: 5; /* Behind the net */
        }
        .flag-tail { font-size: 28px; margin-right: 8px; filter: drop-shadow(0 0 5px black); }
        .runner-img { width: 55px; transform: scaleX(-1); }

        /* TRANSPARENT NET FROM ASSETS */
        .goal-net {
            position: absolute; 
            right: 0; 
            top: 0; 
            bottom: 0; 
            width: 70px; 
            background: url('/assets/net.png') no-repeat center right;
            background-size: cover;
            z-index: 10; /* In front of runners */
            filter: drop-shadow(-5px 0 10px rgba(0,0,0,0.5));
            border-left: 2px solid rgba(255,255,255,0.3);
        }

        /* UI ELEMENTS */
        .live-score {
            position: absolute; right: 85px; top: 18px; z-index: 20;
            font-weight: bold; font-size: 18px; color: #fff;
            background: rgba(0,0,0,0.7); padding: 2px 12px; border-radius: 20px;
            border: 1px solid #39FF14;
        }

        .wins-label {
            position: absolute; left: 15px; font-size: 14px; color: #FFD700;
            font-weight: bold; background: rgba(0,0,0,0.6); 
            padding: 2px 10px; border-radius: 5px; z-index: 20;
        }
    </style>
</head>
<body>

    <div class="header-stats" id="leaderboard">🏆 WAITING FOR GIFTS...</div>
    
    <div id="raceTrack" class="race-container">
        <div class="goal-net"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const track = document.getElementById('raceTrack');
        const board = document.getElementById('leaderboard');

        socket.on('updateRace', (data) => {
            const countries = data.allCountries || [];
            
            // 1. Update Header Leaderboard (Top 3)
            const top3 = countries.slice(0, 3);
            board.innerHTML = `🏆 ` + top3.map(c => `${c.flag} ${c.wins}`).join(' | ');

            // 2. Render/Update Lanes
            countries.forEach((c, index) => {
                let lane = document.getElementById(`lane-${c.id}`);
                
                if (!lane) {
                    lane = document.createElement('div');
                    lane.className = 'lane';
                    lane.id = `lane-${c.id}`;
                    track.appendChild(lane);
                }

                // Rank countries by moving their lane vertical position
                lane.style.top = `${index * 60}px`;

                // Update content of each lane
                lane.innerHTML = `
                    <div class="news-ticker">${c.name} • ${c.name} • ${c.name}</div>
                    <div class="wins-label">WINS: ${c.wins}</div>
                    <div class="live-score">${c.score % 50}/50</div>
                    <div class="runner" id="runner-${c.id}" style="left: calc(${c.currentPos}% + 10px)">
                        <div class="flag-tail">${c.flag}</div>
                        <img src="/assets/fast.gif" class="runner-img">
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
